<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo: div, br e hr</title>
    <style>
        body {
            background-color: #d8c989;
            align-items: center;
        }
        #principal {
           font-size: 30px;
           text-align: center;
           font-family: Poppins, sans-serif;
           font-style: oblique;
           color: #131111;
           padding: 20px;
           margin: 20px;
           border-radius: 10px;
           background-color: #88c28d;
           border: 2px solid #eceaec;
        }
        #segundaria {
           font-size: 30px;
           font-family: Poppins, sans-serif;
           font-style: italic;
           color: #131111;
           text-align: center;
           padding: 20px;
           margin: 20px;
           border-radius: 10px;
           background-color: #74d3ce;
           border: 2px solid #eceaec;
        }
    </style>
</head>
<body>
    <div id="principal">
        Esta é a primeira linha.
        <br>
        Esta é a segunda linha.
    </div>
    <hr>
    <div id="segundaria">
        Esta é a outr divisão da página.
        <br>
        Aqui começa uma nova linha.
    </div>
</body>
</html>
