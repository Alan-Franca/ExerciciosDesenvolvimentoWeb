<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Questrial&display=swap" rel="stylesheet">
    <title>Formulário Estudante</title>
    <style>
        body {
            background-color: #a4c2f0;
            font-family: 'Questrial', sans-serif;
            text-align: center;
            align-items: center;
            padding: 30px;
        }
        div {
            width: 320px;
            border-radius: 0.75rem;
            background-color: #131936;
            padding: 2rem;
            color: rgba(243, 244, 246, 1);
        }
        input {
            display: block;
            color: #a4c2f0;
            border: 2px solid #a4c2f0;
            border-radius: 10px;
            padding: 10px 25px 10px 25px;
            background: transparent;
            max-width: 190px;
            text-align: left;
            margin-right: 0.7rem;
        }
        button {
            border: none;
            outline: none;
            background-color: #a4c2f0;
            padding: 10px 20px;
            font-size: 12px;
            font-weight: 700;
            color: #131936;
            border-radius: 5px;
            transition: all ease 0.1s;
            box-shadow: 0px 5px 0px 0px #c7c3ff;
        }
        button:active {
            transform: translateY(5px);
            box-shadow: 0px 0px 0px 0px #a29bfe;
        }
        label {
            display: block;
            text-align: left;
            margin-right: 0.7rem;
        }
    </style>
</head>
<body>
    <div>
        <h1>Formulário de Cadastro de Estudante</h1>
        <form>
            <p>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite o nome" name="nome">
            </p>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Digite o email" name="email">
            </p>
            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite a senha" name="senha">
            </p>
                <button type="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
        </form>
    </div>
</body>
</html>
