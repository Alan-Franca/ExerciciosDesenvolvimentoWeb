<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementos</title>
</head>
<body>
    <h1>elementos de Lista</h1>
    <p>
        As listas en HTML são utilizadas
        para organizar informaçoes em uma sequência
    </p>

    <h2>Lista não ordenadas</h2>
    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
        <li>Item 4</li>
    </ul>

    <h2>Listas ordenadas</h2>
    <ol>
        <li>Primeiro Item</li>
        <li>Seguando Item</li>
        <li>Terceiro Item</li>
    </ol>
</body>
</html>
