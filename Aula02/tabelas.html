<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas HTML</title>
</head>
<body>
    <h1>Elementos nas Tabelas</h1>
    <p>
        As tabelas em HTML são usadas para organizar dados
        em linhas e colunas.
    </p>

    <table border="1">
        <thead>
            <tr>
               <th>Nome</th> 
               <th>Idade</th> 
               <th>Cidade</th>  
            </tr>
        </thead>
    </table>

</body>
</html>
